
name: Build Hollow Dread

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar mod
        run: chmod +x gradlew && ./gradlew --no-daemon build

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: hollowdread-1.0.0
          path: build/libs/*.jar
